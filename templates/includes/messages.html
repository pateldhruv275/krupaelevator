{% if messages %}
<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show shadow-sm" role="alert">
        <div class="d-flex align-items-center">
          <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill text-success{% elif message.tags == 'error' %}bi-exclamation-octagon-fill text-danger{% else %}bi-info-circle-fill text-info{% endif %} fs-4 me-3"></i>
          <div>{{ message }}</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endif %}
